<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RUMMY WARS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E⚾%3C/text%3E%3C/svg%3E"></head>
<body>
  {% block body %}{% endblock %}

  <footer class="site-footer">
    <p>&copy; {{ current_year }} Rummy Wars. Released under the <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener noreferrer">MIT License</a>.</p>
    <p>Need help? <a href="https://github.com/urbanblight/rummy-wars/wiki/Using-FantasyRummyWars.com" target="_blank" rel="noopener noreferrer">Check the documentation</a></p>
    <p>
      Found a bug? <a href="https://github.com/urbanblight/rummy-wars/issues" target="_blank" rel="noopener noreferrer">Report it on GitHub</a>
      &middot;
      Want to help? <a href="https://github.com/urbanblight/rummy-wars/wiki/Developing-for-FantasyRummyWars.com" target="_blank" rel="noopener noreferrer">Contribute to development</a>
    </p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
